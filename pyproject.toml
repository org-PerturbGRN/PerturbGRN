[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perturbgrn"
version = "0.1.0"
description = "PerturbGRN: gene regulatory network reconstruction and driver prioritization from single-cell perturbation data."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }
authors = [
  { name = "PerturbGRN developers", email = "bm2-lab@tongji.edu.cn" }
]
keywords = [
  "single-cell",
  "perturb-seq",
  "gene regulatory network",
  "driver inference",
  "cell fate engineering"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "anndata==0.11.4",
  "scanpy==1.11.5",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scipy==1.15.3",
  "scikit-learn==1.7.2",
  "numba==0.65.1",
  "networkx==3.4.2",
  "gseapy==1.2.1",
  "mygene==3.2.2",
  "matplotlib==3.10.9",
  "matplotlib-venn==1.1.2",
  "seaborn==0.13.2",
  "tqdm==4.67.3",
  "joblib==1.5.3",
  "h5py==3.16.0",
  "igraph==1.0.0",
  "leidenalg==0.11.0",
  "umap-learn==0.5.12",
  "statsmodels==0.14.6",
  "sympy==1.14.0",
  "requests==2.33.1"
]

[project.scripts]
perturbgrn-run = "main.main:main"

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools.packages.find]
where = ["."]
include = ["main*"]
